asyncapi: null
openapi: null
decision: >-
  Skip OpenAPI and AsyncAPI specification work — no public REST, WebSocket, or
  streaming endpoint exists to model. Re-evaluate if DraftKings ever launches a
  public developer portal, ships an AsyncAPI / OpenAPI artifact, or opens a
  self-serve streaming feed for odds, contests, marketplace drops, or wallet
  events. Until then, treat DraftKings as a closed B2C / B2B platform whose
  integrations are gated by licensed-partner agreements with Genius Sports and
  the DraftKings B2B (SBTech) organization.
